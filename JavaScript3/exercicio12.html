<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercícios de listas</title>

    <script>

        frutas = ["Açaí", "Cereja", "Pera"]
        legumes = ["Abóbora", "Tomate", "Quiabo"]
        feira = []

        alert(frutas)
        alert(legumes)
        
        frutas.forEach(function(fruta) {
            feira.push(fruta)
        })

        legumes.forEach(function(legume) {
            feira.push(legume)
        })

        alert(feira)

    </script>
</head>
